name: Release build

# Builds the standalone Windows app and attaches it to the GitHub release.
# Runs when a release is published, or by hand (Actions -> Release build -> Run workflow),
# in which case the zip is only kept as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # to attach the zip to the release

jobs:
  windows:
    name: Windows app
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true  # the OCR model (135 MB); only fetched for release builds
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[ocr,dev]"
      - name: Build
        run: python Scripts/build_app.py
      - name: Check the built app starts and loads the OCR model
        shell: pwsh
        run: |
          $env:UAKRON_APP_DATA_DIR = "$env:RUNNER_TEMP\apera-data"
          $env:APERA_SELF_TEST_REPORT = "$env:RUNNER_TEMP\self-test.json"
          $p = Start-Process -FilePath "dist\Apera Meter GUI\Apera Meter GUI.exe" -ArgumentList "--self-test" -PassThru
          $null = $p.Handle  # keep a handle so ExitCode is available afterwards
          # A crash at start shows an error dialog that never closes on its own, so don't wait forever.
          if (-not $p.WaitForExit(180000)) {
            $title = (Get-Process -Id $p.Id -ErrorAction SilentlyContinue).MainWindowTitle
            Stop-Process -Id $p.Id -Force
            throw "Self-test did not finish within 3 minutes (window: '$title')"
          }
          Get-Content $env:APERA_SELF_TEST_REPORT
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-app
          path: dist/*.zip
          retention-days: 14
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-Item dist\*.zip).FullName --clobber
